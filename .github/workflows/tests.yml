name: Python tests

on:
  pull_request:
  push:
    branches: [main, submission-hardening]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless "fastapi>=0.110" "httpx>=0.27" httpx2 "pydantic>=2"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
