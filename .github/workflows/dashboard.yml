name: Web dashboard build

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [main, submission-hardening, ui/operations-dashboard-redesign]

jobs:
  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Refresh lockfile on maintenance branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/ui/operations-dashboard-redesign'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh dashboard dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
