name: Web dashboard build

on:
  pull_request:
  push:
    branches: [main, submission-hardening]

jobs:
  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build
